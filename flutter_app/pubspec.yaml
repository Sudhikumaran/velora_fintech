name: velora
description: Velora personal finance — Flutter client for the Velora API.
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fl_chart: ^0.69.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#6366f1"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#6366f1"
    theme_color: "#6366f1"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
