<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/velora-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Velora" />
    <title>Velora — Personal Finance</title>
  <script>
    (function() {
      const t = localStorage.getItem('velora_theme');
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var flag = 'velora_sw_cleared';
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { return window.caches ? caches.keys() : []; })
          .then(function (keys) {
            return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
          })
          .then(function () {
            if (!sessionStorage.getItem(flag)) {
              sessionStorage.setItem(flag, '1');
              location.reload();
            }
          });
      }).catch(function () {});
    })();
  </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
