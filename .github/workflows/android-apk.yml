# Builds a downloadable Android APK and attaches it to GitHub Actions artifacts / Releases.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile API URL
        working-directory: frontend
        run: cp .env.mobile.example .env.mobile

      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm run build:mobile
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Copy APK to releases folder
        run: |
          mkdir -p releases
          cp frontend/android/app/build/outputs/apk/debug/*.apk releases/Velora-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Velora-Android-APK
          path: releases/Velora-android-debug.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/Velora-android-debug.apk
          generate_release_notes: true
